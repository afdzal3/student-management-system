<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>List Students</h2>
            <a th:href="@{/students/new}" class="btn btn-primary">Add New Student</a>
        </div>

        <form th:action="@{/students/search}" method="get" class="row g-2 mb-4">
            <div class="col-md-10">
                <input type="text"
                       name="query"
                       class="form-control"
                       th:value="${searchQuery}"
                       placeholder="Search students by name, email, address, or other details">
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-outline-secondary">Search</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Gender</th>
                        <th>DOB</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${listStudents}">
                        <td th:text="${student.name}">Name</td>
                        <td th:text="${student.address}">Address</td>
                        <td th:text="${student.gender}">Gender</td>
                        <td th:text="${#temporals.format(student.dob, 'yyyy-MM-dd')}">DOB</td>
                        <td th:text="${student.email}">Email</td>
                        <td th:text="${student.mobile}">Mobile</td>
                        <td th:text="${student.phone}">Phone</td>
                        <td>
                            <a th:href="@{/students/edit/{id}(id=${student.id})}"
                                class="btn btn-sm btn-warning me-2">Edit</a>
                            <a href="#" class="btn btn-sm btn-danger delete-link"
                                th:attr="data-url=@{/students/delete/{id}(id=${student.id})}">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('.delete-link').on('click', function (event) {
                event.preventDefault();
                const deleteUrl = $(this).data('url');

                if (confirm('Are you sure you want to delete this student?')) {
                    window.location.href = deleteUrl;
                }
            });
        });
    </script>
</body>

</html>
